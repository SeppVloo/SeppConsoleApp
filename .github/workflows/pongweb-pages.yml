name: Deploy PongWeb to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish PongWeb/PongWeb.csproj -c Release -o out

      # GitHub Pages serves the site from /<repo-name>/, so fix the <base href>.
      - name: Set base href
        run: sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/" />|' out/wwwroot/index.html

      # index.html changed, so its integrity hash in the service-worker manifest must be recomputed.
      - name: Fix service worker hash
        run: |
          python3 - <<'EOF'
          import base64, hashlib, re
          root = "out/wwwroot/"
          h = "sha256-" + base64.b64encode(hashlib.sha256(open(root + "index.html", "rb").read()).digest()).decode()
          p = root + "service-worker-assets.js"
          s = open(p, encoding="utf-8").read()
          s, n = re.subn(r'"hash":\s*"[^"]*",(\s*)"url":\s*"index.html"', lambda m: f'"hash": "{h}",{m.group(1)}"url": "index.html"', s)
          print("updated entries:", n)
          open(p, "w", encoding="utf-8").write(s)
          EOF
          rm -f out/wwwroot/index.html.br out/wwwroot/index.html.gz

      - name: Pages extras
        run: |
          touch out/wwwroot/.nojekyll
          cp out/wwwroot/index.html out/wwwroot/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
